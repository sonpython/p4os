[package]
name = "p4os-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "p4os"
path = "src/main.rs"
test = false
bench = false

[dependencies]
libm = "0.2"
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-dns"] }
p4os-sdk = { path = "../sdk" }
p4os-apps = { path = "../apps" }
p4os-media = { path = "../media" }
p4os-abi = { path = "../abi" }
p4os-net = { path = "../net" }
# rustls-rustcrypto draws randomness through getrandom 0.2; the kernel
# registers its hardware RNG as the custom backend (src/rng.rs).
getrandom = { version = "0.2", features = ["custom"] }
sha2 = { version = "0.10", default-features = false }
fatfs = { git = "https://github.com/rafalh/rust-fatfs", rev = "38b3a79", default-features = false, features = ["alloc", "lfn", "unicode"] }
