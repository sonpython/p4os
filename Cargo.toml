[workspace]
resolver = "2"
members = ["kernel", "gui", "sdk", "apps", "media", "mem", "net", "sim", "abi", "tlsf"]
# User-mode apps build for the bare-metal target in their own workspace.
exclude = ["userapps"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
opt-level = "s"
panic = "abort"
