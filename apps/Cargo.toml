[package]
name = "p4os-apps"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Desktop shell and built-in apps for p4os"

[dependencies]
p4os-sdk = { path = "../sdk" }
p4os-media = { path = "../media" }
libm = "0.2"
# Lock screen passcode hashing (PBKDF2-HMAC-SHA256) and constant-time compare.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2.6", default-features = false }
