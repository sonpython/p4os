# Vendored from crates.io rusty_h264-decoder 0.16.1 (see ../README.md).
[package]
name = "rusty_h264-decoder"
version = "0.16.1"
edition = "2021"
rust-version = "1.80"
authors = ["Mata Network"]
license = "BSD-2-Clause"
description = "Pure-Rust H.264 decoder (vendored, scalar no_std build)"
repository = "https://github.com/remade-with-rust/rusty_h264"
publish = false

[lib]
name = "rusty_h264_decoder"
path = "src/lib.rs"

[features]
default = []
std = ["rusty_h264-common/std"]
libm = ["rusty_h264-common/libm"]
profile = ["std", "rusty_h264-common/profile", "knobs"]
knobs = ["rusty_h264-common/knobs"]
census = ["rusty_h264-common/census"]
cabac-trace = []
# See rusty_h264-common: the SIMD kernel crate is not vendored; never enable.
asm = ["rusty_h264-common/asm"]

[dependencies]
rusty_h264-common = { path = "../common", default-features = false }

[lints.rust]
unsafe_code = "forbid"
